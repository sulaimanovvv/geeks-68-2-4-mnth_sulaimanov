<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Учебный блог на Django">
    <title>{% block title %}Django Blog{% endblock %}</title>

    <style>
        :root {
            --page-bg: #f4f7fb;
            --surface: #ffffff;
            --text: #172033;
            --muted: #667085;
            --primary: #3157d5;
            --primary-dark: #2443ab;
            --border: #dfe5ef;
            --tag-bg: #eaf0ff;
            --radius: 16px;
            --shadow: 0 12px 32px rgba(30, 48, 84, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            background: var(--page-bg);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
        }

        .site-header {
            color: #ffffff;
            background: #172033;
            border-bottom: 4px solid var(--primary);
        }

        .site-header__inner {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            justify-content: flex-end;
        }

        .navigation a {
            color: #d9e1f2;
            font-weight: 600;
            text-decoration: none;
        }

        .navigation a:hover {
            color: #ffffff;
        }

        .navigation .create-post-link {
            padding: 9px 14px;
            color: #ffffff;
            background: var(--primary);
            border-radius: 10px;
            white-space: nowrap;
        }

        .navigation .create-post-link:hover {
            background: var(--primary-dark);
        }

        .search-form {
            width: min(420px, 100%);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-form__input {
            width: 100%;
            min-width: 0;
            height: 42px;
            padding: 0 14px;
            color: var(--text);
            background: #ffffff;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            outline: none;
        }

        .search-form__input:focus {
            border-color: #8ba3f5;
            box-shadow: 0 0 0 3px rgba(139, 163, 245, 0.28);
        }

        .search-form__button {
            height: 42px;
            padding: 0 16px;
            color: #ffffff;
            background: var(--primary);
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .search-form__button:hover {
            background: var(--primary-dark);
        }

        main {
            flex: 1;
            padding: 48px 0 64px;
        }

        .page-heading {
            margin: 0 0 28px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .post-card {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 42px rgba(30, 48, 84, 0.14);
        }

        .post-card__link {
            height: 100%;
            display: flex;
            flex-direction: column;
            color: inherit;
            text-decoration: none;
        }

        .post-card__link:focus-visible {
            outline: 3px solid #8ba3f5;
            outline-offset: -3px;
        }

        .post-card__image {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            object-fit: cover;
            background: #e8edf5;
        }

        .post-card__body {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 24px;
        }

        .post-card__category {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: 0.875rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .post-card__title {
            margin: 0 0 12px;
            font-size: 1.5rem;
            line-height: 1.25;
        }

        .post-card__text {
            margin: 0 0 20px;
            color: var(--muted);
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .tag {
            padding: 5px 10px;
            color: var(--primary-dark);
            background: var(--tag-bg);
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 700;
        }

        .empty-state {
            padding: 48px 24px;
            color: var(--muted);
            text-align: center;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        .search-results-summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            margin: -16px 0 28px;
            color: var(--muted);
        }

        .search-results-summary a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .search-results-summary a:hover {
            color: var(--primary-dark);
        }

        .site-footer {
            padding: 24px 0;
            color: #cbd5e1;
            background: #172033;
            text-align: center;
        }

        .site-footer p {
            margin: 0;
        }

        @media (max-width: 700px) {
            .site-header__inner {
                min-height: 64px;
                flex-wrap: wrap;
                padding: 12px 0;
            }

            .navigation {
                width: 100%;
                flex-basis: 100%;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: space-between;
            }

            .search-form {
                width: 100%;
                order: 3;
            }

            main {
                padding-top: 32px;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="/">Django Blog</a>

            <nav class="navigation" aria-label="Основная навигация">
                <a href="/">Посты</a>
                <a class="create-post-link" href="{% url 'create_post' %}">Создать пост</a>

                <form
                    class="search-form"
                    action="{% url 'post_list' %}"
                    method="get"
                    role="search"
                >
                    <input
                        class="search-form__input"
                        type="search"
                        name="search"
                        value="{{ request.GET.search|default:'' }}"
                        placeholder="Поиск по постам"
                        aria-label="Поиск по постам"
                    >
                    <button class="search-form__button" type="submit">Найти</button>
                </form>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Учебный проект на Django</p>
        </div>
    </footer>
</body>
</html>
